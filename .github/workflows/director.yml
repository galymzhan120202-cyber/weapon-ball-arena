name: Director — record & upload a fight

on:
  schedule:
    # offset onto odd minutes so it doesn't collide with the other bots'
    # cron jobs. Three fights a day, ~8h apart (UTC).
    - cron: "31 0 * * *"
    - cron: "17 8 * * *"
    - cron: "43 16 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (blank = random)"
        required: false
      max_seconds:
        description: "Max clip length"
        required: false
        default: "45"
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      privacy:
        description: "YouTube privacy"
        type: choice
        options: [public, unlisted, private]
        default: public

concurrency:
  group: director
  cancel-in-progress: false

permissions:
  contents: write        # so the run can commit state/ back

jobs:
  fight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install recorder deps + Chrome
        working-directory: record
        run: |
          npm ci --no-audit --no-fund
          npx --yes puppeteer browsers install chrome

      - name: Install uploader deps
        working-directory: upload
        run: npm ci --no-audit --no-fund

      - name: Plan the match
        id: seed
        env:
          WBA_CLIENT_SECRETS_JSON: ${{ secrets.WBA_CLIENT_SECRETS_JSON }}
          WBA_YOUTUBE_TOKEN_JSON: ${{ secrets.WBA_YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "${{ github.event.inputs.seed }}" ]; then
            # manual one-off: explicit seed, random matchup, not part of the bracket
            echo "seed=${{ github.event.inputs.seed }}" >> "$GITHUB_OUTPUT"
            echo "tourney=0" >> "$GITHUB_OUTPUT"
            echo "One-off seed ${{ github.event.inputs.seed }}"
            exit 0
          fi
          # 1) community vote — if recent comments name a clear top-2 matchup, run that
          VOTE=$(node upload/vote.js tally 2>/dev/null || true)
          if echo "$VOTE" | grep -q '^vote=1$'; then
            echo "$VOTE" >> "$GITHUB_OUTPUT"
            echo "seed=$(( (RANDOM<<15 | RANDOM) ))" >> "$GITHUB_OUTPUT"
            echo "tourney=0" >> "$GITHUB_OUTPUT"
            echo "Community-voted matchup"
            exit 0
          fi
          # 2) otherwise play the next match in the running tournament bracket
          node upload/tournament.js next
          echo "tourney=1" >> "$GITHUB_OUTPUT"

      - name: Record the fight
        run: |
          ARGS=""
          if [ "${{ steps.seed.outputs.tourney }}" = "1" ] || [ "${{ steps.seed.outputs.vote }}" = "1" ]; then
            ARGS="--a=${{ steps.seed.outputs.a }} --b=${{ steps.seed.outputs.b }}"
          fi
          node record/record.js \
            --seed=${{ steps.seed.outputs.seed }} \
            --max-seconds=${{ github.event.inputs.max_seconds || '45' }} \
            --out=out/wba_${{ steps.seed.outputs.seed }}.mp4 \
            $ARGS --verbose

      - name: Upload artifacts (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: fight-${{ steps.seed.outputs.seed }}
          path: |
            out/wba_${{ steps.seed.outputs.seed }}.mp4
            out/wba_${{ steps.seed.outputs.seed }}.jpg
            out/wba_${{ steps.seed.outputs.seed }}.json
          retention-days: 7

      - name: Upload to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WBA_CLIENT_SECRETS_JSON: ${{ secrets.WBA_CLIENT_SECRETS_JSON }}
          WBA_YOUTUBE_TOKEN_JSON: ${{ secrets.WBA_YOUTUBE_TOKEN_JSON }}
          WBA_TELEGRAM_NOTIFY_TOKEN: ${{ secrets.WBA_TELEGRAM_NOTIFY_TOKEN }}
          WBA_TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.WBA_TELEGRAM_NOTIFY_CHAT_ID }}
          WBA_FUND_URL: ${{ vars.WBA_FUND_URL }}
        run: |
          if [ -z "$WBA_YOUTUBE_TOKEN_JSON" ]; then
            echo "::warning::WBA_YOUTUBE_TOKEN_JSON not set — skipping upload. Add the repo secrets to go live."
            exit 0
          fi
          node upload/upload.js \
            --video=out/wba_${{ steps.seed.outputs.seed }}.mp4 \
            --privacy=${{ github.event.inputs.privacy || 'public' }}

      - name: Record result + commit state
        if: ${{ github.event.inputs.dry_run != 'true' && github.ref == 'refs/heads/master' }}
        run: |
          JSON=out/wba_${{ steps.seed.outputs.seed }}.json
          [ -f "$JSON" ] || { echo "no match json, skipping state update"; exit 0; }
          grep -q '"videoUrl"' "$JSON" || { echo "no videoUrl (upload skipped), not touching state"; exit 0; }
          node upload/record-result.js "$JSON"
          if [ "${{ steps.seed.outputs.tourney }}" = "1" ]; then
            node upload/tournament.js record "$JSON"
          fi
          git config user.name  "wba-director[bot]"
          git config user.email "wba-director[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && { echo "state unchanged"; exit 0; }
          git commit -m "chore(state): $(node -p "require('./state/champion.json').winner") x$(node -p "require('./state/champion.json').streak") — match ${{ steps.seed.outputs.seed }} [skip ci]"
          git pull --rebase --autostash origin master || true
          git push origin HEAD:master
